<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
    <iframe 
        src="https://player.bilibili.com/player.html?bvid={{ .Get "bvid" | default (.Get 0) }}&page={{ .Get "page" | default 1 }}&high_quality=1&danmaku=1" 
        allowfullscreen="allowfullscreen" 
        width="100%" 
        height="500" 
        scroll="no" 
        frameborder="0" 
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
    </iframe>
</div>
